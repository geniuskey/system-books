<body data-chapter="glossary">
<main class="chapter">
  <header class="chapter-hero">
    <div class="eyebrow">Chapter 25</div>
    <h1>용어집 & 종합 퀴즈</h1>
    <p class="lead">카메라 메뉴와 리뷰 기사에 나오는 용어들을 한곳에 모았습니다. 검색하거나 장별로 걸러 보고, 링크를 눌러 해당 장으로 돌아가 복습하세요. 마지막으로 전 범위 종합 퀴즈로 실력을 점검해 봅시다.</p>
  </header>

  <section id="glossary">
    <h2>용어집</h2>
    <input class="gl-search" id="gl-q" type="search" placeholder="용어 검색 (예: 조리개, ISO, bokeh, 동조)" aria-label="용어 검색">
    <div class="gl-filter" id="gl-f"></div>
    <div class="gl-count" id="gl-n"></div>
    <div class="gl-list" id="gl-list"></div>
  </section>

  <section class="quiz-sec" id="quiz">
    <h2>종합 퀴즈</h2>
    <div class="score"><span id="sc-t">0 / 0</span><span class="bar"><i id="sc-b"></i></span><button class="btn" id="sc-r">다시 풀기</button></div>
    <div class="quiz" id="final"></div>
  </section>
</main>

<script src="../js/glossary-data.js"></script>
<script>
(function () {
  const T = window.BOOK_GLOSSARY.terms.map((t) => [t.ko, t.en, t.def, t.chapters[0]]);
  const chs = Object.fromEntries(CB.CHAPTERS.map((c) => [c.slug, c]));
  const list = document.getElementById("gl-list"), qEl = document.getElementById("gl-q"), fEl = document.getElementById("gl-f"), nEl = document.getElementById("gl-n");
  let filt = "all";
  const used = CB.CHAPTERS.map((c) => c.slug).filter((s) => T.some((t) => t[3] === s));
  fEl.innerHTML = `<button data-c="all" class="on">전체</button>` + used.map((s) => `<button data-c="${s}">${chs[s].num} ${chs[s].title}</button>`).join("");
  fEl.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { filt = b.dataset.c; fEl.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); render(); }));
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function render() {
    const q = qEl.value.trim().toLowerCase();
    const rows = T.filter((t) => (filt === "all" || t[3] === filt) && (!q || (t[0] + " " + t[1] + " " + t[2]).toLowerCase().includes(q)));
    nEl.textContent = `${rows.length}개 / 전체 ${T.length}개`;
    list.innerHTML = rows.map((t) => `<div class="gl-item"><h4>${esc(t[0])}<span class="en">${esc(t[1])}</span></h4><p>${esc(t[2])}</p><a class="ch" href="${t[3]}.html">${chs[t[3]].num}장 · ${chs[t[3]].title} →</a></div>`).join("") || `<p style="color:var(--text-dim)">검색 결과가 없습니다.</p>`;
  }
  qEl.addEventListener("input", render);
  render();

  /* ------------------------------------------------ 종합 퀴즈 */
  const Q = [
    ["f/4 · 1/250 · ISO 400에서 조리개를 f/2.8로 열었다. 같은 밝기를 유지하려면 셔터는?", ["1/125", "1/500", "1/1000"], 1, "1스톱 밝아졌으니 셔터를 1스톱 빠르게: 1/500.", "exposure"],
    ["배경 흐림을 가장 크게 하는 조합은?", ["24 mm, f/8, 피사체 5 m", "85 mm, f/1.8, 피사체 2 m", "50 mm, f/4, 피사체 10 m"], 1, "긴 초점거리, 큰 조리개, 가까운 거리가 모두 심도를 얕게 한다.", "aperture"],
    ["f/22에서 사진이 f/8보다 뿌옇게 보이는 주된 이유는?", ["수차", "회절", "노이즈"], 1, "조리개를 많이 조이면 회절 번짐이 커진다.", "aperture"],
    ["달리는 강아지를 멈추고 싶을 때 가장 중요한 설정은?", ["빠른 셔터 속도", "낮은 ISO", "작은 조리개"], 0, "움직임 정지는 셔터 속도가 결정한다.", "shutter"],
    ["전자 셔터로 프로펠러가 휘어 찍히는 현상은?", ["모아레", "롤링 셔터 왜곡", "색수차"], 1, "센서를 줄 단위로 순차적으로 읽기 때문이다.", "shutter"],
    ["ISO를 올리면 노이즈가 늘어 보이는 근본 원인은?", ["ISO가 센서를 뜨겁게 해서", "적은 빛(적은 광자)을 크게 증폭해서", "렌즈가 어두워져서"], 1, "노이즈의 주범은 빛 부족이고, ISO는 그 상태를 밝게 키울 뿐이다.", "iso"],
    ["16장을 평균 내면 노이즈는?", ["1/16", "1/4", "그대로"], 1, "무작위 노이즈는 1/√N. √16 = 4.", "smartphone"],
    ["하얀 눈밭이 회색으로 찍혔다. 해결책은?", ["노출 보정 +", "노출 보정 −", "WB를 텅스텐으로"], 0, "노출계가 눈을 18% 회색으로 만들려 했으니 + 보정.", "modes"],
    ["S 모드에서 조리개 값이 깜박인다. 의미는?", ["렌즈 고장", "카메라가 맞출 수 있는 조리개 범위를 벗어났다", "배터리 부족"], 1, "최대 개방으로도 부족하거나 최소 조리개로도 과다하다는 경고.", "modes"],
    ["히스토그램 오른쪽 끝에 벽이 쌓였다면?", ["노출 부족", "하이라이트 클리핑", "색 공간 오류"], 1, "최대 밝기로 잘린 픽셀이 많다는 뜻.", "histogram"],
    ["장면이 카메라 DR보다 넓을 때의 해결책이 아닌 것은?", ["브라케팅 + HDR 합성", "필 플래시로 그림자 밝히기", "ISO를 크게 올리기"], 2, "ISO를 올리면 DR은 보통 줄어든다.", "histogram"],
    ["콘트라스트 AF의 약점은?", ["방향을 몰라 헌팅이 생긴다", "밝은 곳에서 동작하지 않는다", "정확도가 낮다"], 0, "대비 값만 보고 정점을 찾으므로 앞뒤로 더듬는다.", "focus"],
    ["움직이는 피사체에 알맞은 AF 모드는?", ["AF-S", "AF-C", "MF"], 1, "AF-C는 반셔터 동안 계속 초점을 다시 맞춘다.", "focus"],
    ["APS-C(×1.5)에 56 mm 렌즈를 끼우면 풀프레임 기준 화각은?", ["약 37 mm", "약 56 mm", "약 84 mm"], 2, "56 × 1.5 = 84 mm.", "focal"],
    ["'망원 압축'의 진짜 원인은?", ["초점거리", "촬영 거리", "조리개"], 1, "원근감은 거리가 정한다. 망원은 멀리서 찍게 만들 뿐이다.", "focal"],
    ["전구 조명 아래에서 사진이 주황색이다. WB를 어떻게?", ["색온도를 3,000K 근처로", "색온도를 7,500K로", "틴트를 초록으로"], 0, "조명이 3,000K라고 알려 주면 카메라가 파랗게 보정한다.", "color"],
    ["RAW가 JPEG보다 유리하지 않은 것은?", ["WB 재조정", "하이라이트 복구", "파일 크기와 즉시 공유"], 2, "RAW는 크고 현상이 필요하다.", "raw"],
    ["'5스톱 손떨림 보정'이면 1/250 대신 대략?", ["1/125", "1/30", "1/8"], 2, "2⁵ = 32배: 1/250 × 32 ≈ 1/8.", "stabilization"],
    ["플래시–피사체 거리가 1 m에서 2 m가 되면 빛은?", ["1/2", "1/4", "그대로"], 1, "역제곱 법칙: (1/2)² = 1/4, 2스톱.", "flash"],
    ["동조 속도보다 빠른 셔터에서 일반 플래시를 쓰면?", ["검은 띠가 생긴다", "색이 바뀐다", "노이즈가 생긴다"], 0, "슬릿만 열린 순간에 섬광이 터져 일부만 빛을 받는다.", "flash"],
    ["30p 영상의 180° 셔터 속도는?", ["1/30", "1/60", "1/120"], 1, "1/(2 × 30) = 1/60.", "video"],
    ["맑은 날 f/1.8로 24p 영상을 찍을 때 필요한 것은?", ["ND 필터", "높은 ISO", "플래시"], 0, "셔터가 1/50로 묶여 있으니 빛을 줄여야 한다.", "video"],
    ["폰 인물 모드가 머리카락 경계에서 실수하는 이유는?", ["렌즈가 작아서", "깊이 지도 추정이 어려워서", "셔터가 느려서"], 1, "소프트웨어 보케는 깊이 지도의 정확도에 달려 있다.", "smartphone"],
    ["폰 카메라 앱의 2× 버튼(1×와 3× 카메라만 있을 때)은?", ["광학 줌", "메인 카메라를 잘라 쓰는 디지털 줌", "망원 카메라를 넓게 쓰는 것"], 1, "사이 배율은 넓은 쪽 카메라를 잘라 쓴다.", "smartphone"],
  ];
  const box = document.getElementById("final");
  let answered = 0, correct = 0;
  function build() {
    answered = 0; correct = 0;
    box.innerHTML = Q.map(([q, opts, a, exp, ch], i) => `<div class="quiz-q"><p>${i + 1}. ${q}<span class="ch">${chs[ch].num}장</span></p><div class="opts">${opts.map((o, k) => `<button class="opt"${k === a ? " data-correct" : ""}>${o}</button>`).join("")}</div><div class="quiz-exp">${exp} <a href="${ch}.html">${chs[ch].title} 복습 →</a></div></div>`).join("");
    box.querySelectorAll(".quiz-q").forEach((qq) => {
      const opts = [...qq.querySelectorAll("button.opt")];
      opts.forEach((b) => b.addEventListener("click", () => {
        opts.forEach((o) => { o.disabled = true; if (o.hasAttribute("data-correct")) o.classList.add("right"); });
        if (!b.hasAttribute("data-correct")) b.classList.add("wrong"); else correct++;
        qq.classList.add("done"); answered++; score();
      }));
    });
    score();
  }
  function score() {
    document.getElementById("sc-t").textContent = answered === Q.length ? `완료! ${correct} / ${Q.length} 정답 ${correct >= Q.length * 0.9 ? "— 카메라 마스터 🎉" : correct >= Q.length * 0.7 ? "— 훌륭해요!" : "— 틀린 장을 복습해 보세요"}` : `${correct} 정답 · ${answered} / ${Q.length} 풀이`;
    document.getElementById("sc-b").style.width = (answered / Q.length) * 100 + "%";
  }
  document.getElementById("sc-r").addEventListener("click", build);
  build();
})();
</script>
</body>
